<style>
   /* 侧边栏整体 */
  .side-bar {
    background-color: rgb(63, 93, 157) !important;
    border-right: 1px solid #d0dae5 !important;
    width: 13rem !important;   /* 调窄侧边栏，默认约 15.5rem */
  }

  /* 侧边栏顶部站点标题 */
  .site-title {
    color: #f7fbff !important; 
  }

  /* 导航链接文字 */
  .nav-list-link {
    font-size: 0.9rem;
    color: #e5e8ec !important; 
  }

  /* 鼠标悬停 */
  .nav-list-link:hover {
    background-color: #dce4ec !important;
    color: #1a252f !important;
  }

  /* 当前激活页面 */
  .nav-list-link.active {
    background-color: #d0dae5 !important;
    color: #0a1117 !important;
    font-weight: 600;
    border-left: 3px solid #4a6fa5 !important;
  }

  /* 子级导航链接（层级缩进后） */
  .nav-list .nav-list .nav-list-link {
    color: #ffffff !important;
  }

  /* 搜索框 */
  .search-input {
    background-color: #ffffff !important;
    color: #2c3e50 !important;
    border: 1px solid #d0dae5 !important;
  }

  /* 搜索框占位文字 */
  .search-input::placeholder {
    color: #8a9bb0 !important;
  }

  /* 正文标题（主内容区的 h1、h2 等） */
  .main-content h1,
  .main-content h2,
  .main-content h3,
  .main-content h4 {
    color: #ffffff !important;
  }

  /* 正文文字 */
  .main-content {
    color: #2c3e50 !important;
  }


/* 正文内容容器：取消最大宽度限制，靠左排列 */
.main-content {
  max-width: none !important;
  margin-left: 0 !important;
  margin-right: auto !important;
}

/* 侧边栏底部页脚文字 */
.site-footer {
  color: #6b7c93 !important;   /* 中灰蓝，和背景协调 */
  font-size: 0.75rem !important;
}

/* 页脚里的链接 */
.site-footer a {
  color: #84bbee !important;
}

.site-footer a:hover {
  color: #84bbee !important;
}
</style>
